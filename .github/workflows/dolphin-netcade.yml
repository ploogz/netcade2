name: Build Netcade Dolphin (Windows)

on:
  workflow_dispatch:
    inputs:
      dolphin_tag:
        description: Dolphin release to build (must match launcher/emulators.json)
        default: '2609a'
      build_name:
        description: Netcade build name (must match dolphin.netcade.version in emulators.json)
        default: '2609a-netcade1'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Keep line endings unchanged
        run: git config --global core.autocrlf false

      - name: Netcade sources
        uses: actions/checkout@v4
        with:
          path: netcade

      - name: Dolphin sources
        uses: actions/checkout@v4
        with:
          repository: dolphin-emu/dolphin
          ref: ${{ inputs.dolphin_tag }}
          path: dolphin
          fetch-depth: 1

      - name: Dolphin libraries (submodules)
        working-directory: dolphin
        run: |
          git submodule update --init --recursive --depth 1 --jobs 8
          if ($LASTEXITCODE -ne 0) {
            "Shallow download missed a pinned version; fetching full history instead" | Out-Host
            git submodule update --init --recursive --jobs 8
          }
          git submodule status --recursive | Select-String '^-' | ForEach-Object { throw "Missing library: $_" }

      - name: Apply Netcade patch
        working-directory: dolphin
        run: |
          git apply --check -v --whitespace=nowarn ../netcade/dolphin-netcade/netcade.patch
          if ($LASTEXITCODE -ne 0) { throw 'The Netcade patch does not apply to this Dolphin version' }
          git apply --whitespace=nowarn ../netcade/dolphin-netcade/netcade.patch

      - name: Visual Studio build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: dolphin
        run: cmake --preset ninja-release-x64 -DENABLE_AUTOUPDATE=OFF -DENABLE_ANALYTICS=OFF -DUSE_DISCORD_PRESENCE=OFF

      - name: Build
        working-directory: dolphin
        run: cmake --build --preset ninja-build-release-x64

      - name: Package
        shell: pwsh
        run: ./netcade/dolphin-netcade/package-windows.ps1 -DolphinDir dolphin -BuildName "${{ inputs.build_name }}" -Out dolphin-netcade.7z

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-netcade
          path: dolphin-netcade.7z

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dolphin-${{ inputs.build_name }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dolphin-netcade.7z --repo $env:GITHUB_REPOSITORY --title "Dolphin ${{ inputs.build_name }} (Netcade build)" --notes "Dolphin ${{ inputs.dolphin_tag }} with Netcade's NetPlay patch. Netcade downloads this automatically."
          } else {
            gh release upload $tag dolphin-netcade.7z --repo $env:GITHUB_REPOSITORY --clobber
          }
          "Download link:" | Out-Host
          "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/dolphin-netcade.7z" | Out-Host
